name: TypeScript Test
on:
  push:
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v2
          - name: Setup Node.js
            uses: actions/setup-node@v1
            with:
              node-version: '14'
          - name: Install and test
            run: npm install && npm run test
          - name: Report success
            run: exit 0